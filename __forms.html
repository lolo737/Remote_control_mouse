<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>forms</title></head>
<body hidden>
  <!-- Static skeleton so Netlify registers the "reserve" form at deploy time. -->
  <form name="reserve" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="reserve">
    <input type="text" name="name">
    <input type="email" name="email">
    <input type="text" name="finish">
    <input type="text" name="quantity">
    <textarea name="notes"></textarea>
    <input type="text" name="bot-field">
  </form>
</body>
</html>
